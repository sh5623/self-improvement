<svg width="920" height="336" viewBox="0 0 920 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two measured incidents that produced the budget devices: a changelog reached 42 blocks against a cap of 15 because the cap was never wired into a procedure, and an always-loaded rule document reached 34 kilobytes paid on every session">
  <rect x="0" y="0" width="920" height="336" fill="#FAF9F6" rx="12"/>

  <text x="40" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1F2937">What a rule nobody triggers actually costs</text>
  <text x="40" y="56" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#78716C">both measured on one project · the incidents the budget devices were built from</text>

  <!-- incident 1 -->
  <text x="40" y="94" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F2937">A cap that lived only in a file header</text>

  <text x="40" y="127" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#57534E">cap</text>
  <rect x="120" y="114" width="180" height="20" rx="4" fill="#A8A29E"/>
  <text x="312" y="129" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#57534E">15 blocks</text>

  <text x="40" y="161" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#57534E">actual</text>
  <rect x="120" y="148" width="504" height="20" rx="4" fill="#B4413C"/>
  <text x="636" y="163" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="600" fill="#B4413C">42 blocks · 949 lines</text>

  <text x="120" y="188" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716C">2.8x over, and nothing reported it, because no procedure step ever ran the check.</text>
  <text x="120" y="205" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716C">Fix: whoever records an entry runs `grep -c '^### '` on the spot and rotates the overflow.</text>

  <line x1="40" y1="226" x2="880" y2="226" stroke="#E7E5E4" stroke-width="1"/>

  <!-- incident 2 -->
  <text x="40" y="254" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F2937">A rule document every session paid for</text>

  <rect x="40" y="266" width="300" height="46" rx="8" fill="#FFFFFF" stroke="#B4413C" stroke-width="1.5"/>
  <text x="190" y="288" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="600" fill="#B4413C">34 KB</text>
  <text x="190" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#78716C">always-loaded, every session, every file</text>

  <g stroke="#D97757" stroke-width="2" fill="none"><line x1="350" y1="289" x2="382" y2="289"/></g>
  <polygon points="394,289 382,283 382,295" fill="#D97757"/>

  <rect x="400" y="266" width="300" height="46" rx="8" fill="#FFFFFF" stroke="#5F8A62" stroke-width="1.5"/>
  <text x="550" y="288" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="600" fill="#5F8A62">5 path-scoped rules</text>
  <text x="550" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#78716C">loaded only when a matching file is touched</text>

  <text x="716" y="284" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716C">Citations of the old</text>
  <text x="716" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716C">locations: one table.</text>
</svg>

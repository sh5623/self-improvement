<svg width="920" height="348" viewBox="0 0 920 348" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fixture test of the v0.2.0 procedure change: five runs before reproduced the failure every time, three runs after passed and converged on the same shape, and two further candidate rules were rejected by the same method">
  <rect x="0" y="0" width="920" height="348" fill="#FAF9F6" rx="12"/>

  <text x="40" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1F2937">The procedure was tested the way it tells you to test a rule</text>
  <text x="40" y="56" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#78716C">v0.2.0 · one fixture project · same gap scenario handed to subagents</text>

  <!-- BEFORE -->
  <rect x="40" y="76" width="390" height="150" rx="10" fill="#FFFFFF" stroke="#B4413C" stroke-width="1.5"/>
  <text x="60" y="102" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F2937">Before the change</text>
  <text x="60" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#78716C">no failure-type rule, no form matching</text>

  <circle cx="76"  cy="152" r="14" fill="#B4413C"/><text x="76"  y="157" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✗</text>
  <circle cx="116" cy="152" r="14" fill="#B4413C"/><text x="116" y="157" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✗</text>
  <circle cx="156" cy="152" r="14" fill="#B4413C"/><text x="156" y="157" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✗</text>
  <circle cx="196" cy="152" r="14" fill="#B4413C"/><text x="196" y="157" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✗</text>
  <circle cx="236" cy="152" r="14" fill="#B4413C"/><text x="236" y="157" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✗</text>

  <text x="270" y="157" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#B4413C">5 / 5 runs</text>
  <text x="60" y="196" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#57534E">The failure reproduced every single time.</text>
  <text x="60" y="213" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#57534E">Five runs, five different shapes of wrong.</text>

  <!-- arrow -->
  <g stroke="#D97757" stroke-width="2" fill="none"><line x1="440" y1="151" x2="472" y2="151"/></g>
  <polygon points="484,151 472,145 472,157" fill="#D97757"/>

  <!-- AFTER -->
  <rect x="490" y="76" width="390" height="150" rx="10" fill="#FFFFFF" stroke="#5F8A62" stroke-width="1.5"/>
  <text x="510" y="102" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F2937">After the change</text>
  <text x="510" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#78716C">failure type → form matching → effect check</text>

  <circle cx="526" cy="152" r="14" fill="#5F8A62"/><text x="526" y="157" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✓</text>
  <circle cx="566" cy="152" r="14" fill="#5F8A62"/><text x="566" y="157" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✓</text>
  <circle cx="606" cy="152" r="14" fill="#5F8A62"/><text x="606" y="157" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✓</text>

  <text x="640" y="157" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#5F8A62">3 / 3 runs</text>
  <text x="510" y="196" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#57534E">Passed, and converged on the same shape.</text>
  <text x="510" y="213" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#57534E">Agreement is the signal the wording binds.</text>

  <!-- rejected band -->
  <rect x="40" y="244" width="840" height="80" rx="10" fill="#F5F4F1" stroke="#A8A29E" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="60" y="268" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#57534E">Two more candidate rules went through the same method and were rejected</text>
  <text x="60" y="290" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716C">One because the existing doctrine already caught it 3/3, so the rule was redundant.</text>
  <text x="60" y="308" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716C">One because it had no procedure step to wire itself into, so it was destined to go stale.</text>
</svg>

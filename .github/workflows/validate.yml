name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-and-init:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install validation dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Validate both runtime packages and YAML frontmatter
        run: python plugins/self-improvement/scripts/validate_packages.py --repo .
      - name: Check data preservation, runtime boundaries and relocated payload
        run: python -m unittest discover -s plugins/self-improvement/tests -v

  claude-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate Claude plugin and marketplace separately
        run: |
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate .claude-plugin/marketplace.json --strict
